{% extends "accounts/base.html" %}
{% block title %}Delete {{ task.title }}{% endblock %}
{% block content %}
<section class="bg-white border rounded-2 mx-auto p-4 p-md-5" style="max-width: 620px;">
    <p class="small text-uppercase text-danger fw-semibold mb-2">Delete task</p><h1 class="h2 mb-3">Delete &quot;{{ task.title }}&quot;?</h1><p class="text-secondary">This permanently deletes the task and cannot be undone.</p>
    <form method="post" class="d-flex flex-column flex-sm-row gap-2 mt-4">{% csrf_token %}<button class="btn btn-danger" type="submit">Delete task</button><a class="btn btn-light border" href="{% url 'tasks:detail' task.pk %}">Keep task</a></form>
</section>
{% endblock %}
